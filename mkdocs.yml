site_name: Keel
site_description: Learning by building, one port at a time.
site_url: https://rayjk123.github.io/Keel/
repo_url: https://github.com/Rayjk123/Keel
repo_name: Rayjk123/Keel
edit_uri: edit/main/docs/
theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - scheme: default
      primary: teal
      accent: indigo
      media: "(prefers-color-scheme: light)"
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: indigo
      media: "(prefers-color-scheme: dark)"
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - content.code.copy
    - content.action.edit
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - md_in_html
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      check_paths: true
nav:
  - Journey: index.md
  - "Destination 1: One-file agent":
      - Overview: destinations/one-file-agent/index.md
      - Getting started: destinations/one-file-agent/getting-started.md
      - How it works: destinations/one-file-agent/how-it-works.md
      - Adapters: destinations/one-file-agent/adapters.md
      - Benchmarks: destinations/one-file-agent/benchmarks.md
      - AWS Bedrock: destinations/one-file-agent/bedrock.md
  - Project:
      - Development: development.md
      - Changelog: changelog.md
